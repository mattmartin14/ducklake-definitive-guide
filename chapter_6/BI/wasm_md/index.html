<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuckDB-WASM + MotherDuck (md_dl1)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <header class="hero">
        <h1>DuckDB-WASM Query Console</h1>
        <p>
          Connected to MotherDuck database <strong>md_dl1</strong>.
          Use Cmd/Ctrl+Enter to run SQL.
        </p>
        <div id="status" class="status">Initializing...</div>
      </header>

      <section class="editor-panel">
        <label for="sqlInput">SQL Query</label>
        <textarea id="sqlInput" spellcheck="false"></textarea>
        <div class="actions">
          <button id="runQuery" type="button">Run Query</button>
          <button id="clearResults" type="button" class="secondary">Clear Results</button>
        </div>
      </section>

      <section class="results-panel">
        <div class="results-header">
          <h2>Results</h2>
          <span id="rowMeta" class="meta"></span>
        </div>
        <div id="results" class="results" aria-live="polite"></div>
      </section>
    </main>

    <script src="/config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
