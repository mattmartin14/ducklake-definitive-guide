version: "3.9"

# ── Shared environment variables ─────────────────────────────────────────────
x-superset-env: &superset-env
  SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  SUPERSET_SECRET_KEY: "ducklake-superset-demo-key-change-in-production"
  DATABASE_URL: "postgresql+psycopg2://superset:superset@db/superset"
  REDIS_URL: "redis://redis:6379/0"
  PYTHONPATH: /app/pythonpath
  # Prevents Superset from loading its built-in example dashboards
  SUPERSET_LOAD_EXAMPLES: "no"

services:

  # ── Superset metadata store ─────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: superset_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the 'ducklake' catalog DB on first start
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-ducklake.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache / Celery broker ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: superset_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Apache Superset ─────────────────────────────────────────────────────────
  superset:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: superset
    restart: unless-stopped
    environment:
      <<: *superset-env
    ports:
      - "8088:8088"           # Superset UI
    volumes:
      # Superset configuration
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      # Entrypoint + helper scripts
      - ./scripts:/scripts:ro
      # Shared volume: DuckLake catalog, parquet files, and materialized DuckDB file
      - ducklake_data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/bin/bash", "/scripts/bootstrap.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health | grep -q OK"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  postgres_data:      # Superset metadata (users, dashboards, etc.)
  ducklake_data:      # DuckLake catalog + parquet files + DuckDB mirror
